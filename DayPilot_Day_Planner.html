.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form .fullfield{grid-column:1/-1}

.table-scroll{overflow-x:auto;margin-top:16px}.schedule-table{width:100%;min-width:760px;border-collapse:collapse;text-align:left}.schedule-table th,.schedule-table td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}.schedule-table th{color:var(--muted);font-size:12px;text-transform:uppercase}.schedule-table td:first-child{font-weight:700}.schedule-table .iconbtn{font-size:16px}

.title{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:4px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cstack{display:flex;flex-direction:column;gap:16px}.calhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.calhead h2{margin:0}

.loading-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#10100e;color:#fff;transition:opacity .45s ease,visibility .45s ease;cursor:pointer}.loading-screen.hidden{opacity:0;visibility:hidden}.loading-content{text-align:center;padding:24px}.loading-logo{width:160px;height:160px;object-fit:contain}.loading-title{margin:12px 0 24px;font-size:20px;font-weight:700}.loading-track{width:min(220px,70vw);height:3px;margin:auto;overflow:hidden;background:#3a3524}.loading-track span{display:block;width:35%;height:100%;background:var(--gold);animation:loading-progress 1.2s ease-in-out infinite}@keyframes loading-progress{from{transform:translateX(-110%)}to{transform:translateX(310%)}}@media(prefers-reduced-motion:reduce){.loading-screen{transition:none}.loading-track span{animation:none;width:100%}}

<script>
const KEY="daypilot_v1";
const urlParams=new URLSearchParams(window.location.search);
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
  tasks:[], reminders:[], lists:[], goals:[], workouts:[], habits:[], timetable:[], settings:{}
};
db.settings=db.settings||{};
db.timetable=db.timetable||[];
const availableThemes=["dark","light","crimson","winter","summer","autumn","spring","christmas","newyear","halloween","valentines","ramadan"];
const requestedTheme=urlParams.get("theme");
const savedTheme=availableThemes.includes(requestedTheme)?requestedTheme:(availableThemes.includes(db.settings.theme)?db.settings.theme:"dark");
document.documentElement.dataset.theme=savedTheme;
document.getElementById("themeSelect").value=savedTheme;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function setTheme(theme){if(!availableThemes.includes(theme))return;document.documentElement.dataset.theme=theme;db.settings.theme=theme;save()}
function seedSampleData(){
 const td=today();
 db={
  tasks:[
   {id:"t1",title:"Strategic Q4 Product Roadmap & Vision",due:td,priority:"High",list:"Work",notes:"Executive sync with design and product leads",done:false},
   {id:"t2",title:"Review Mobile Navigation & Touch Gestures",due:td,priority:"High",list:"Development",notes:"Ensure 44px hit targets and smooth momentum scroll",done:true},
   {id:"t3",title:"Client Presentation Deck & Metrics Review",due:td,priority:"Normal",list:"Work",notes:"Prepare slide 8-12 on user retention",done:false},
   {id:"t4",title:"Deep Work: Study Cloud System Architecture",due:td,priority:"Normal",list:"Learning",notes:"Distributed caches and local-first data sync",done:false},
   {id:"t5",title:"Weekly Financial Audit & Budget Allocation",due:td,priority:"Low",list:"Personal",notes:"Track savings target and subscriptions",done:false}
  ],
  reminders:[
   {id:"r1",title:"Executive Sprint Standup",date:td,time:"09:30",note:"Daily blockers and alignment"},
   {id:"r2",title:"Product Architecture Review",date:td,time:"14:00",note:"Review database indexing and API latency"},
   {id:"r3",title:"Hydration & Evening Stretch",date:td,time:"20:00",note:"Take 10m off screen"}
  ],

let alarmAudioContext=null,alarmAudioUnlocked=false,alarmSoundIsPlaying=false,alarmOscillators=[],alarmStopTimeout=null;
function prepareAlarmAudio(){
 const AudioContext=window.AudioContext||window.webkitAudioContext;
 if(!AudioContext)return;
 try{
  if(!alarmAudioContext)alarmAudioContext=new AudioContext();
  if(alarmAudioContext.state==="suspended")alarmAudioContext.resume().catch(()=>{});
  alarmAudioUnlocked=true;
 }catch(error){alarmAudioUnlocked=false}
}
function playAlarmSound(){
 if(!alarmAudioContext||alarmAudioContext.state!=="running")return;
 stopAlarmSound(false);
 const start=alarmAudioContext.currentTime;
 const melody=[523.25,659.25,783.99,1046.5,880,783.99,659.25,587.33,698.46,880,1046.5,880,698.46,659.25,587.33,523.25];
 for(let index=0;index<150;index++){
  const cycle=Math.floor(index/melody.length),register=cycle%3===1?.75:cycle%3===2?1.125:1;
  const oscillator=alarmAudioContext.createOscillator(),gain=alarmAudioContext.createGain(),at=start+.05+index*.4;
  oscillator.type="triangle";oscillator.frequency.value=melody[index%melody.length]*register;
  gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.42,at+.025);gain.gain.exponentialRampToValueAtTime(.0001,at+.34);
  oscillator.connect(gain);gain.connect(alarmAudioContext.destination);oscillator.start(at);oscillator.stop(at+.36);alarmOscillators.push(oscillator);
 }
 alarmSoundIsPlaying=true;updateAlarmStatus();alarmStopTimeout=setTimeout(()=>stopAlarmSound(false),60000);
}
function stopAlarmSound(announce=true){
 if(alarmStopTimeout){clearTimeout(alarmStopTimeout);alarmStopTimeout=null}
 alarmOscillators.forEach(oscillator=>{try{oscillator.stop()}catch(error){}});alarmOscillators=[];
 const wasPlaying=alarmSoundIsPlaying;alarmSoundIsPlaying=false;updateAlarmStatus();
 if(announce&&wasPlaying)toast("Alarm stopped.");
}
function updateAlarmStatus(){
 const button=document.getElementById("alarmButton"),status=document.getElementById("alarmStatus");
 document.getElementById("stopAlarmButton").hidden=!alarmSoundIsPlaying;
 if(window.DayPilotAndroid){const allowed=window.DayPilotAndroid.hasNotificationPermission();button.textContent=alarmAudioUnlocked?"🔔 Alarms enabled":"🔔 Enable alarms";status.textContent=allowed?"Android notifications and sound alarms are enabled.":"Allow Android notifications and sound alerts.";return}
 if(!( "Notification" in window)){button.textContent=alarmAudioUnlocked?"🔔 Sound alarms enabled":"🔔 Enable sound alarms";status.textContent="Sound alerts work while DayPilot is open.";return}
 if(Notification.permission==="granted"){button.textContent=alarmAudioUnlocked?"🔔 Alarms enabled":"🔔 Enable alarm sound";status.textContent=alarmAudioUnlocked?"Desktop notifications and sound alarms are enabled.":"Desktop notifications enabled; click to unlock alarm sound."}
 else if(Notification.permission==="denied"){button.textContent=alarmAudioUnlocked?"🔔 Sound alarms enabled":"🔔 Enable sound alarms";status.textContent=alarmAudioUnlocked?"Desktop notifications are blocked; sound alarms work while DayPilot is open.":"Desktop notifications are blocked; click to enable sound alarms."}
 else{button.textContent="🔔 Enable alarms";status.textContent="Allow desktop notifications and sound alerts."}
}

 ${card()}<div class="row between wrap"><h2>Today's Workout</h2>${tw.length?`<div class="row"><span class="muted">${done}/${tw.length} done</span>${done?`<button class="btn secondary" onclick="clearDoneWorkout()">Clear completed</button>`:""}<button class="btn secondary" onclick="clearWorkoutToday()">Clear all</button></div>`:""}</div>
 ${tw.length?`<div class="progress" style="margin:10px 0 4px"><i style="width:${pct}%"></i></div><div class="list">${tw.map(w=>`<div class="item"><div class="row between"><div class="check"><input type="checkbox" ${w.done?"checked":""} onchange="toggleWorkout('${w.id}')"><div><div class="title" style="${w.done?"text-decoration:line-through;opacity:.6":""}">${esc(w.name)}</div><div class="meta">${esc(w.sets||"")} ${w.notes?"• "+esc(w.notes):""}</div></div></div><button class="iconbtn" onclick="removeItem('workouts','${w.id}')">✕</button></div></div>`).join("")}</div>${done===tw.length?`<p class="muted" style="margin:12px 0 0">🎉 Workout complete — nice work!</p>`:""}`:`<div class="empty">Your workout is empty. Add exercises or pick a routine above.</div>`}</div></div>`;
}
function habits(){
 return `${card()}<div class="row between"><div><h2>Habit Tracker 🔥</h2><p class="muted">Small actions repeated daily become big results.</p></div><button class="card" onclick="addHabit()">＋ Habit</button></div></div>
 ${card()}${db.habits.length?`<div class="list">${db.habits.map(h=>{let checked=h.checkedDates?.includes(today());let streak=0,d=new Date();while(h.checkedDates?.includes(ymd(d))){streak++;d.setDate(d.getDate()-1)}return `<div class="item"><div class="row between"><div class="check"><input type="checkbox" ${checked?"checked":""} onchange="toggleHabit('${h.id}')"><div><div class="title">${esc(h.name)}</div><div class="meta">🔥 ${streak} day streak • ${esc(h.frequency||"Daily")}</div></div></div><button class="iconbtn" onclick="removeItem('habits','${h.id}')">✕</button></div></div>`}).join("")}</div>`:`<div class="empty">Add habits like reading, exercise, prayer, study, hydration or practice.</div>`}</div>`;
}
let timer={sec:25*60,active:false,mode:"Focus",interval:null};
function focus(){
 return `${card()}<div class="timer"><div class="muted">${timer.mode} Session</div><div class="clock">${String(Math.floor(timer.sec/60)).padStart(2,"0")}:${String(timer.sec%60).padStart(2,"0")}</div><div class="row" style="justify-content:center"><button class="btn success" onclick="toggleTimer()">${timer.active?"Pause":"Start"}</button><button class="btn secondary" onclick="resetTimer()">Reset</button><button class="btn secondary" onclick="setTimer(5)">5 min</button><button class="btn secondary" onclick="setTimer(25)">25 min</button><button class="btn secondary" onclick="setTimer(50)">50 min</button></div></div></div>
 ${card()}<h2>Focus Rules</h2><div class="list"><div class="item">🎯 Choose one important task.</div><div class="item">📵 Remove distractions.</div><div class="item">⏱ Work until the timer ends.</div><div class="item">☕ Take a short break and repeat.</div></div></div>`;
}
let calY=new Date().getFullYear(),calM=new Date().getMonth(),calSel=today();
function calItems(ds){
 return {
  tasks:db.tasks.filter(t=>t.due===ds),
  reminders:db.reminders.filter(r=>r.date===ds).sort((a,b)=>(a.time||"").localeCompare(b.time||"")),
  goals:db.goals.filter(g=>g.deadline===ds),
  workouts:db.workouts.filter(w=>w.date===ds),
  habits:db.habits.filter(h=>(h.checkedDates||[]).includes(ds))
 };
}
function calNav(delta){
 if(delta===0){calY=new Date().getFullYear();calM=new Date().getMonth();calSel=today()}
 else{let d=new Date(calY,calM+delta,1);calY=d.getFullYear();calM=d.getMonth();
  const pre=calY+"-"+String(calM+1).padStart(2,"0");
  if(!calSel.startsWith(pre))calSel=today().startsWith(pre)?today():pre+"-01"}
 render();
}
function selectDay(ds){calSel=ds;render()}
function calendar(){
 const y=calY,m=calM,first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),pre=y+"-"+String(m+1).padStart(2,"0")+"-";
 let cells="";for(let i=0;i<first;i++)cells+=`<div class="day out"></div>`;
 let stat={taskOpen:0,taskTotal:0,rem:0,goal:0,wk:0};
 for(let n=1;n<=days;n++){
  const ds=pre+String(n).padStart(2,"0"),it=calItems(ds);
  stat.taskTotal+=it.tasks.length;stat.taskOpen+=it.tasks.filter(t=>!t.done).length;stat.rem+=it.reminders.length;stat.goal+=it.goals.length;stat.wk+=it.workouts.filter(w=>w.done).length;
  const chips=[
   ...it.tasks.map(t=>({k:"task",txt:"✓ "+t.title,done:t.done})),
   ...it.reminders.map(r=>({k:"reminder",txt:"🔔 "+(r.time?r.time+" ":"")+r.title})),
   ...it.goals.map(g=>({k:"goal",txt:"🎯 "+g.title})),
   ...(it.workouts.length?[{k:"workout",txt:"💪 "+it.workouts.filter(w=>w.done).length+"/"+it.workouts.length+" exercises"}]:[])
  ];
  const open=it.tasks.filter(t=>!t.done).length+it.reminders.length+it.goals.length+it.workouts.length;
  cells+=`<div class="day ${ds===today()?"today":""} ${ds===calSel?"sel":""}" onclick="selectDay('${ds}')"><span class="num">${n}</span>${chips.slice(0,2).map(c=>`<span class="chip ${c.k} ${c.done?"done":""}">${esc(c.txt)}</span>`).join("")}${chips.length>2?`<div class="more">+${chips.length-2} more</div>`:""}<div class="dots">${open?'<span class="dot"></span>'.repeat(Math.min(open,4)):""}</div></div>`;
 }
 const it=calItems(calSel),isToday=calSel===today();
 const row=(inner,rm)=>`<div class="item"><div class="row between"><div class="check">${inner}</div>${rm}</div></div>`;
 const parts=[];
 if(it.tasks.length)parts.push(`<div class="sect">Tasks</div><div class="list">${it.tasks.map(t=>row(`<input type="checkbox" ${t.done?"checked":""} onchange="toggleTask('${t.id}')"><div><div class="title" style="${t.done?"text-decoration:line-through;opacity:.6":""}">${esc(t.title)}</div><div class="meta">${esc(t.priority||"Normal")}${t.list?" • "+esc(t.list):""}${t.notes?" • "+esc(t.notes):""}</div></div>`,`<div><button class="iconbtn" onclick="editTask('${t.id}')">✎</button><button class="iconbtn" onclick="removeItem('tasks','${t.id}')">✕</button></div>`)).join("")}</div>`);
 if(it.reminders.length)parts.push(`<div class="sect">Reminders</div><div class="list">${it.reminders.map(r=>row(`<span>🔔</span><div><div class="title">${esc(r.title)}</div><div class="meta">${r.time?esc(r.time):"All day"}${r.note?" • "+esc(r.note):""}</div></div>`,`<button class="iconbtn" onclick="removeItem('reminders','${r.id}')">✕</button>`)).join("")}</div>`);
 if(it.goals.length)parts.push(`<div class="sect">Goal deadlines</div><div class="list">${it.goals.map(g=>{const p=Math.min(100,Math.round((g.progress||0)/(g.target||1)*100));return `<div class="item"><div class="row between"><div class="title">🎯 ${esc(g.title)}</div><b>${p}%</b></div><div class="progress" style="margin-top:8px"><i style="width:${p}%"></i></div></div>`}).join("")}</div>`);
 if(it.workouts.length)parts.push(`<div class="sect">Workout</div><div class="list">${it.workouts.map(w=>`<div class="item"><div class="title" style="${w.done?"text-decoration:line-through;opacity:.6":""}">💪 ${esc(w.name)}</div><div class="meta">${esc(w.sets||"")} ${w.done?"• Done":""}</div></div>`).join("")}</div>`);
 if(it.habits.length)parts.push(`<div class="sect">Habits completed</div><div class="list">${it.habits.map(h=>`<div class="item"><span class="title">🔥 ${esc(h.name)}</span></div>`).join("")}</div>`);
 const dayCard=`${card()}<div class="row between wrap"><div><h2 style="margin-bottom:2px">${isToday?"Today · ":""}${fmt(calSel)}</h2><span class="muted">${new Date(calSel+"T00:00:00").toLocaleDateString(undefined,{weekday:"long"})}</span></div><div class="row"><button class="btn" onclick="addTask({due:'${calSel}'})">＋ Task</button><button class="btn secondary" onclick="addReminder('${calSel}')">🔔 Reminder</button></div></div>${parts.length?parts.join(""):`<div class="empty">Nothing scheduled for this day.</div>`}</div>`;
 const t0=today();
 const overdue=db.tasks.filter(t=>!t.done&&t.due&&t.due<t0).sort((a,b)=>a.due.localeCompare(b.due));
 let up=[...db.tasks.filter(t=>!t.done&&t.due&&t.due>=t0).map(t=>({d:t.due,tm:"",k:"✓",txt:t.title,id:t.id,type:"task"})),
  ...db.reminders.filter(r=>r.date&&r.date>=t0).map(r=>({d:r.date,tm:r.time||"",k:"🔔",txt:r.title})),
  ...db.goals.filter(g=>g.deadline&&g.deadline>=t0).map(g=>({d:g.deadline,tm:"",k:"🎯",txt:g.title+" (deadline)"}))]
  .sort((a,b)=>(a.d+a.tm).localeCompare(b.d+b.tm)).slice(0,8);
 const upCard=`${card()}<h2>Coming up</h2>${overdue.length?`<div class="sect" style="margin-top:4px">Overdue · ${overdue.length}</div><div class="list">${overdue.slice(0,5).map(t=>row(`<input type="checkbox" onchange="toggleTask('${t.id}')"><div><div class="title">${esc(t.title)}</div><div class="meta">Due ${fmt(t.due)}</div></div>`,`<button class="iconbtn" onclick="selectDay('${t.due}');calY=+'${t.due}'.slice(0,4);calM=+'${t.due}'.slice(5,7)-1;render()">View</button>`)).join("")}</div>`:""}
  <div class="sect" ${overdue.length?"":'style="margin-top:4px"'}>Next up</div>${up.length?`<div class="list">${up.map(u=>`<div class="item"><div class="row between"><div><div class="title">${u.k} ${esc(u.txt)}</div><div class="meta">${fmt(u.d)}${u.tm?" • "+esc(u.tm):""}</div></div><button class="iconbtn" onclick="calY=+'${u.d}'.slice(0,4);calM=+'${u.d}'.slice(5,7)-1;selectDay('${u.d}')">View</button></div></div>`).join("")}</div>`:`<div class="empty">Nothing coming up. Enjoy the free time!</div>`}</div>`;
 return `<div class="cstack">${card()}<div class="calhead"><h2>${new Date(y,m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><div class="row"><button class="btn secondary" onclick="calNav(-1)">‹</button><button class="btn secondary" onclick="calNav(0)">Today</button><button class="btn secondary" onclick="calNav(1)">›</button></div></div>
 <div class="grid" style="margin-bottom:16px"><div class="card kpi"><span class="muted">Tasks due</span><strong>${stat.taskOpen}<span class="muted" style="font-size:14px"> open / ${stat.taskTotal}</span></strong></div><div class="card kpi"><span class="muted">Reminders</span><strong>${stat.rem}</strong></div><div class="card kpi"><span class="muted">Goal deadlines</span><strong>${stat.goal}</strong></div><div class="card kpi"><span class="muted">Exercises done</span><strong>${stat.wk}</strong></div></div>
 <div class="calendar">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="muted" style="padding:7px">${x}</div>`).join("")}${cells}</div>
 <div class="legend"><span><i style="background:var(--gold)"></i>Task</span><span><i style="background:#e7c45c"></i>Reminder</span><span><i style="background:#c49a36"></i>Goal deadline</span><span><i style="background:#92948d"></i>Workout</span><span>Tap a day for details</span></div></div>
 ${dayCard}${upCard}</div>`;
}

function addTask(existing=null){
 let x=existing||{};
 modal(`<h2>${existing&&existing.id?"Edit Task":"Add Task"}</h2><div class="form">
 <input id="fTitle" class="fullfield" placeholder="Task title" value="${esc(x.title||"")}">
 <input id="fDue" type="date" value="${x.due||today()}"><select id="fPriority"><option ${x.priority==="Low"?"selected":""}>Low</option><option ${(!x.priority||x.priority==="Normal")?"selected":""}>Normal</option><option ${x.priority==="High"?"selected":""}>High</option></select>
 <input id="fList" placeholder="List (e.g. School)" value="${esc(x.list||"")}"><input id="fNotes" placeholder="Notes" value="${esc(x.notes||"")}">
 </div><br><button class="card" onclick="saveTask('${x.id||""}')">Save Task</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>`);
}
function saveTask(eid){let x={id:eid||id(),title:document.getElementById("fTitle").value.trim(),due:document.getElementById("fDue").value,priority:document.getElementById("fPriority").value,list:document.getElementById("fList").value.trim(),notes:document.getElementById("fNotes").value.trim(),done:false};if(!x.title)return toast("Give the task a title.");let i=db.tasks.findIndex(t=>t.id===eid);if(i>=0){x.done=db.tasks[i].done;db.tasks[i]=x}else db.tasks.push(x);save();closeModal();render();toast("Task saved.");}
function editTask(i){addTask(db.tasks.find(x=>x.id===i))}
function toggleTask(i){let x=db.tasks.find(x=>x.id===i);x.done=!x.done;save();render()}
function addReminder(date){modal(`<h2>Add Reminder</h2><div class="form"><input id="rTitle" class="fullfield" placeholder="Reminder"><input id="rDate" type="date" value="${date||today()}"><input id="rTime" type="time" value="09:00"><input id="rNote" class="fullfield" placeholder="Note"></div><br><button class="card" onclick="saveReminder()">Save Reminder</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>`)}
function saveReminder(){let title=rTitle.value.trim();if(!title)return;db.reminders.push({id:id(),title,date:rDate.value,time:rTime.value,note:rNote.value});save();closeModal();render();toast("Reminder added.")}
function updateTimetableFields(){const type=sType.value,repeat=sRepeat.value,options=timetableSubtypes[type];sSubtype.innerHTML=options.map(item=>`<option>${item}</option>`).join("");sDayField.hidden=repeat==="once";sDateField.hidden=repeat!=="once";sSubject.placeholder=type==="Family"?"Activity, chore, prayer, or event":type==="Work"?"Meeting, shift, or work activity":"Class, study, or school activity"}
function addTimetableEntry(){modal(`<h2>Add Timetable Activity</h2><div class="form"><select id="sType" onchange="updateTimetableFields()"><option>Family</option><option>School</option><option>Work</option></select><select id="sSubtype"></select><input id="sSubject" class="fullfield" placeholder="Activity"><select id="sRepeat" onchange="updateTimetableFields()"><option value="weekly">Every week</option><option value="once">One-time event</option></select><div id="sDayField"><select id="sDay">${weekdays.map((day,index)=>`<option value="${index+1}" ${index+1===timetableDay()?"selected":""}>${day}</option>`).join("")}</select></div><div id="sDateField" hidden><input id="sDate" aria-label="Event date" type="date" value="${today()}"></div><div class="row"><input id="sStart" aria-label="Start time" type="time" value="09:00"><input id="sEnd" aria-label="End time" type="time" value="10:00"></div><input id="sPeople" placeholder="People involved"><input id="sLocation" placeholder="Location"><input id="sNotes" class="fullfield" placeholder="Details or notes"></div><br><button class="card" onclick="saveTimetableEntry()">Save Activity</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>`);updateTimetableFields()}
function saveTimetableEntry(){const type=sType.value,repeat=sRepeat.value,subject=sSubject.value.trim(),start=sStart.value,end=sEnd.value,date=sDate.value;if(!subject){toast("Enter an activity or event.");return}if(!start||!end||end<=start){toast("End time must be after start time.");return}if(repeat==="once"&&!date){toast("Choose a date for this event.");return}db.timetable.push({id:id(),type,subtype:sSubtype.value,repeat,day:repeat==="weekly"?+sDay.value:null,date:repeat==="once"?date:"",start,end,subject,people:sPeople.value.trim(),location:sLocation.value.trim(),notes:sNotes.value.trim()});save();closeModal();render();toast("Timetable activity added.")}
function addList(){modal(`<h2>New List</h2><input id="listName" placeholder="List name"><br><br><button class="card" onclick="saveList()">Create List</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>`)}
function saveList(){let n=listName.value.trim();if(n){db.lists.push({id:id(),name:n});save();closeModal();render()}}
function addGoal(){modal(`<h2>Create Goal</h2><div class="form"><input id="gTitle" class="fullfield" placeholder="Goal"><input id="gTarget" type="number" min="1" value="10" placeholder="Target units"><input id="gCat" placeholder="Category"><input id="gDate" type="date"></div><br><button class="card" onclick="saveGoal()">Create Goal</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>`)}
function saveGoal(){let title=gTitle.value.trim();if(!title)return;db.goals.push({id:id(),title,target:+gTarget.value||1,progress:0,category:gCat.value,deadline:gDate.value});save();closeModal();render()}
function changeGoal(i,n){let g=db.goals.find(x=>x.id===i);g.progress=Math.max(0,(g.progress||0)+n);save();render()}
function addHabit(){modal(`<h2>Add Habit</h2><input id="hName" placeholder="Habit name"><br><br><input id="hFreq" placeholder="Frequency (Daily, weekdays, etc.)" value="Daily"><br><br><button class="card" onclick="saveHabit()">Create Habit</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>`)}
function saveHabit(){let name=hName.value.trim();if(!name)return;db.habits.push({id:id(),name,frequency:hFreq.value,checkedDates:[]});save();closeModal();render()}
function toggleHabit(i){let h=db.habits.find(x=>x.id===i);h.checkedDates=h.checkedDates||[];let d=today(),p=h.checkedDates.indexOf(d);p>=0?h.checkedDates.splice(p,1):h.checkedDates.push(d);save();render()}
function addExercise(i,silent){const e=exercises[i];if(todaysWorkout().some(w=>w.name===e.name)){if(!silent)toast(e.name+" is already in today's workout.");return false}
 db.workouts.push({id:id(),name:e.name,sets:e.sets,group:e.group,date:today(),done:false});if(!silent){save();render();toast(e.name+" added to today's workout.")}return true}
function addRoutine(r){const rt=routines[r];let added=0;rt.items.forEach(n=>{const i=exercises.findIndex(e=>e.name===n);if(i>-1&&addExercise(i,true))added++});save();render();toast(added?rt.name+": "+added+" exercise"+(added>1?"s":"")+" added.":"Those exercises are already in today's workout.")}
function toggleWorkout(i){let w=db.workouts.find(x=>x.id===i);if(!w)return;w.done=!w.done;save();render()}
function clearDoneWorkout(){db.workouts=db.workouts.filter(w=>!(w.date===today()&&w.done));save();render()}
function clearWorkoutToday(){db.workouts=db.workouts.filter(w=>w.date!==today());save();render()}
function newWorkout(){modal(`<h2>Custom Exercise</h2><div class="form"><input id="wName" class="fullfield" placeholder="Exercise name"><input id="wSets" placeholder="Sets / reps / time"><select id="wGroup"><option>Upper</option><option>Lower</option><option>Cardio</option><option>Core</option></select><input id="wNotes" class="fullfield" placeholder="Notes"></div><br><button class="btn" onclick="saveCustomWorkout()">Add Exercise</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>`)}
function saveCustomWorkout(){let name=wName.value.trim();if(!name){toast("Enter an exercise name.");return}db.workouts.push({id:id(),name,sets:wSets.value.trim(),group:wGroup.value,notes:wNotes.value.trim(),date:today(),done:false});save();closeModal();render()}
function workoutFilter(x){wFilter=x;render()}
function removeItem(type,i){if(!confirm("Remove this item?"))return;db[type]=db[type].filter(x=>x.id!==i);save();render()}
function openQuick(){modal(`<h2>Quick Add</h2><div class="grid"><button class="btn" onclick="closeModal();addTask()">✓ Task</button><button class="card" onclick="closeModal();addReminder()">🔔 Reminder</button><button class="card" onclick="closeModal();addGoal()">🎯 Goal</button><button class="card" onclick="closeModal();addHabit()">🔥 Habit</button><button class="card" onclick="closeModal();newWorkout()">💪 Workout</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}
function toggleTimer(){if(timer.active){clearInterval(timer.interval);timer.active=false}else{prepareAlarmAudio();updateAlarmStatus();timer.active=true;timer.interval=setInterval(()=>{if(timer.sec<=0){clearInterval(timer.interval);timer.active=false;const completedMode=timer.mode;sendAlarmNotification(completedMode+" session complete",completedMode==="Focus"?"Your focus session is over. Take a break.":"Your break is over. Ready to focus again?");timer.sec=completedMode==="Focus"?5*60:25*60;timer.mode=completedMode==="Focus"?"Break":"Focus"}else timer.sec--;render()},1000)}render()}
function resetTimer(){clearInterval(timer.interval);stopAlarmSound(false);timer.active=false;timer.sec=25*60;timer.mode="Focus";render()}
function setTimer(m){clearInterval(timer.interval);stopAlarmSound(false);timer.active=false;timer.sec=m*60;timer.mode="Focus";render()}

render();
document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active", x.dataset.page===page));
const loadingEl=document.getElementById("loadingScreen");
if(loadingEl){
 loadingEl.onclick=()=>loadingEl.classList.add("hidden");
 if(urlParams.get("noload")==="1"||urlParams.get("page")||window.location.hash){
  loadingEl.classList.add("hidden");
 }else{
  setTimeout(()=>loadingEl.classList.add("hidden"),1200);
 }
}
</script>
</body>
</html>
